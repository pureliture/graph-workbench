<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Graph Workbench Fixture</title>
    <link rel="stylesheet" href="/demo/styles.css" />
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">SANITIZED FIXTURE</p>
        <h1>Graph Workbench</h1>
        <p>Arrow keys focus nodes. Enter selects. Escape clears selection.</p>
      </header>
      <section class="workspace" aria-label="Graph workbench fixture">
        <div id="graph" class="graph"></div>
        <aside>
          <p class="eyebrow">EVENT</p>
          <output id="event">Renderer is starting.</output>
        </aside>
      </section>
    </main>
    <script type="module" src="/demo/main.ts"></script>
  </body>
</html>
